</head><body>
<title>Мой огород</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky header with year switcher; scrollable, zoomable site plan in metres; docked bottom panel for the selected object */
:root{
  --bg:#eef0e6; --surface:#fbfbf6; --fg:#24261d; --muted:#686c5a; --line:#d6d9c8;
  --leaf:#3f6b2a; --on-leaf:#ffffff; --danger:#b2452d; --scrim:rgba(20,22,14,.45);
  --plot:#e3e8d4; --grid:#cfd6bd; --grid5:#b4bd9e;
  --bld:#7a1f2e; --bld-roof:#94303f; --bld-side:#621826; --bld-ridge:#3f0c16;
  --gh-a:#8ccbe8; --gh-b:#d4eef9; --gh-frame:#2f7aa0;
  --soil:#1c1a18; --soil-fleck:#3b342d; --bed-stroke:#000000; --sprout:#5fa63a; --sprout-hi:#9fd46e;
  --fl-red:#d6332a; --fl-orange:#f08a1c; --fl-yellow:#f6d03a; --flower-stroke:#9c3412;
  --path:#9b9b98; --path-joint:#666663; --path-hi:#c4c4c0;
  --tree:#4f8c32; --tree-hi:#86c25e; --tree-stroke:#2b5219;
  --deck:#b8834e; --deck-hi:#d4a36c; --deck-joint:#6e4524; --furn:#5a3a1e;
  --sel:#d9771f; --label:#ffffff; --halo:rgba(0,0,0,.7);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15170f; --surface:#1f2217; --fg:#e7e9dc; --muted:#a3a792; --line:#343829;
  --leaf:#9cc77c; --on-leaf:#15170f; --danger:#ea8f77; --scrim:rgba(0,0,0,.6);
  --plot:#232819; --grid:#2e3423; --grid5:#414a32;
  --sel:#f0a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15170f; --surface:#1f2217; --fg:#e7e9dc; --muted:#a3a792; --line:#343829;
  --leaf:#9cc77c; --on-leaf:#15170f; --danger:#ea8f77; --scrim:rgba(0,0,0,.6);
  --plot:#232819; --grid:#2e3423; --grid5:#414a32;
  --sel:#f0a35a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(200px + env(safe-area-inset-bottom,0px))}
.pad{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.2);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;font:600 12px var(--f-body);touch-action:none;font-variant-numeric:tabular-nums}
.pad button.mv:active{background:var(--sel);border-color:var(--sel);color:#ffffff}
.pad svg{width:22px;height:22px}
.pad button.on{background:var(--sel);border-color:var(--sel);color:#ffffff}
.pad button:disabled{opacity:.3}
.btn.lock.on{background:var(--sel);border-color:var(--sel);color:#ffffff}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.v3d{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.v3d-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.v3d-bar strong{font:500 16px var(--f-display)}
.v3d-bar .g{display:flex;gap:8px}
.v3d-stage{flex:1;position:relative;min-height:0;touch-action:none;background:#cfe6f5}
.v3d-stage canvas{display:block;width:100%;height:100%}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:#3d4a55;text-align:center;padding:16px;font-size:15px}
.v3d-hint{font-size:12px;color:var(--muted);text-align:center;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn[aria-pressed="false"]{opacity:.6}
.panel.still{animation:none}
.wx{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.wx .btn{display:inline-flex;align-items:center;gap:6px}
.wxlink{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wxlink:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wx svg{width:24px;height:24px;flex:none}
.wx .btn svg{width:18px;height:18px;margin:0}
.wx .tx{min-width:0;flex:1}
.wx .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx .sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx .go{color:var(--leaf);font-weight:600;font-size:14px;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:0 0 8px}
.note a{color:var(--leaf)}
.err{color:var(--danger);font-size:13px;margin:0 0 8px}
.sheet h3.sec{font:500 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.safety{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
.safety span{flex:1;min-width:180px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.careform{display:flex;flex-direction:column;margin-top:10px}
.careform .btn{align-self:flex-start}
.crop .cd{font-variant-numeric:tabular-nums;font-weight:500}
.crop b{font-weight:600}
.ck{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;margin-left:6px}
.ck::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.locknote{font-size:13px;color:var(--muted);margin:2px 0 8px}
#stepBtn{color:var(--leaf);line-height:1.1;text-align:center}
#stepBtn small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.pad button:focus-visible{outline:3px solid var(--leaf);outline-offset:1px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font:700 20px/1.1 var(--f-display);margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--leaf)}
.year{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.year button{background:none;border:0;color:var(--fg);font:500 20px var(--f-body);width:40px;height:40px;cursor:pointer}
.year strong{font:500 17px var(--f-display);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.tools .g{display:flex;gap:6px;align-items:center}
.hint{font-size:13px;line-height:19px;color:var(--muted);height:38px;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-variant-numeric:tabular-nums}
.btn{font:500 15px var(--f-body);border-radius:10px;padding:9px 13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.sm{font-size:13px;padding:7px 11px}
.btn.icon{width:38px;height:38px;padding:0;font-size:20px;line-height:1}
.btn.pri{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.btn.del{color:var(--danger);background:transparent}
.btn.del.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,select:focus-visible,.year button:focus-visible,.fab:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

.banner{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}

.planbox{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);max-height:calc(100vh - 220px);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
svg#plan{display:block;user-select:none;-webkit-user-select:none}
svg#plan .obj{cursor:grab;touch-action:none}
svg#plan .hdl{cursor:nwse-resize;touch-action:none}
svg#plan text{pointer-events:none;font-family:var(--f-body)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--s)}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:18px;background:var(--leaf);color:var(--on-leaf);border:0;display:flex;align-items:center;gap:8px;font:600 15px var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:6}
.fab svg{width:22px;height:22px}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.12);max-height:56vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel .in{max-width:720px;margin:0 auto}
.ph{display:flex;align-items:center;gap:10px;padding-block:12px 10px;position:sticky;top:0;background:var(--surface);z-index:1}
.ph input{flex:1;min-width:0;font:500 17px var(--f-display);border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);padding:4px 2px}
.kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select{font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-block:2px 4px}
h3.sec{font:500 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.crops{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.crop:first-child{border-top:0}
.crop .t{flex:1;min-width:0;overflow-wrap:anywhere}
.crop .v{color:var(--muted)}
.crop button{background:none;border:0;color:var(--muted);font-size:20px;width:32px;height:32px;cursor:pointer;border-radius:8px}
.none{padding:12px;color:var(--muted);font-size:14px}
.addcrop{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.addcrop input{font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.hist{font-size:14px;display:flex;flex-direction:column;gap:4px}
.hist b{font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding-top:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:500 18px var(--f-display);margin:0 0 14px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button:last-child:nth-child(odd){grid-column:1/-1}
.types button{display:flex;align-items:center;gap:10px;text-align:left}
.types i{width:20px;height:20px;border-radius:4px;border:2px solid var(--s);flex:none}
@media (prefers-reduced-motion: no-preference){.sheet,.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.7}}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>План участка</h1><div class="sync" id="sync"><i></i><span>Загрузка…</span></div></div>
    <div class="year" aria-label="Год посадок"><button id="yPrev" aria-label="Предыдущий год">‹</button><strong id="yVal"></strong><button id="yNext" aria-label="Следующий год">›</button></div>
  </header>
  <div class="wx" id="wx"></div>
  <div id="banner"></div>
  <div class="tools">
    <div class="g"><button class="btn sm" id="plotBtn"></button><button class="btn sm pri" id="b3d">3D</button><button class="btn icon" id="undoBtn" aria-label="Отменить последнее действие" title="Отменить" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button></div>
    <div class="g"><button class="btn icon" id="zOut" aria-label="Уменьшить">−</button><button class="btn icon" id="zIn" aria-label="Увеличить">+</button></div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
<div class="pad" id="pad" hidden aria-label="Сдвиг объекта">
  <button id="lockBtn" aria-label="Закрепить замком"></button><button class="mv" data-mv="0,-1" aria-label="Вверх"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
  <button class="mv" data-mv="-1,0" aria-label="Влево"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="stepBtn" aria-label="Шаг сдвига"></button>
  <button class="mv" data-mv="1,0" aria-label="Вправо"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <span></span><button class="mv" data-mv="0,1" aria-label="Вниз"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><span></span>
</div>
<div class="v3d" id="v3d" hidden role="dialog" aria-label="Участок в 3D">
  <div class="v3d-bar"><strong>Участок в 3D · <span id="v3dYear"></span></strong>
    <div class="g"><button class="btn sm" id="v3dLabels" aria-pressed="true">Подписи</button><button class="btn sm pri" id="v3dClose">К плану</button></div></div>
  <div class="v3d-stage" id="v3dStage"><div class="v3d-msg" id="v3dMsg">Загружаю 3D…</div></div>

</div>

<div id="sheetRoot"></div>

<script>
(function(){
const TYPES={
  bed:{l:"Грядка",sw:"radial-gradient(circle,var(--soil-fleck) 15%,var(--soil) 20%) 0 0/5px 5px",s:"--bed-stroke",crops:true},
  greenhouse:{l:"Теплица",sw:"linear-gradient(135deg,var(--gh-a),var(--gh-b) 45%,#fff 50%,var(--gh-b) 55%,var(--gh-a))",s:"--gh-frame",crops:true},

  path:{l:"Дорожка",sw:"repeating-linear-gradient(0deg,var(--path-joint) 0 1px,var(--path) 1px 4px)",s:"--path-joint",crops:false}};
TYPES.rest={l:"Зона отдыха",sw:"repeating-linear-gradient(0deg,var(--deck-joint) 0 1px,var(--deck) 1px 4px)",s:"--deck-joint",crops:false};
const STATIC=`
<linearGradient id="gGh" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" style="stop-color:var(--gh-a)"/><stop offset=".42" style="stop-color:var(--gh-b)"/>
  <stop offset=".5" style="stop-color:#ffffff;stop-opacity:.95"/><stop offset=".58" style="stop-color:var(--gh-b)"/>
  <stop offset="1" style="stop-color:var(--gh-a)"/></linearGradient>
<linearGradient id="gFl" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" style="stop-color:var(--fl-red)"/><stop offset=".5" style="stop-color:var(--fl-orange)"/><stop offset="1" style="stop-color:var(--fl-yellow)"/></linearGradient>
<radialGradient id="gTree" cx=".38" cy=".35" r=".7">
  <stop offset="0" style="stop-color:var(--tree-hi)"/><stop offset="1" style="stop-color:var(--tree)"/></radialGradient>
<pattern id="pSoil" patternUnits="userSpaceOnUse" width=".3" height=".3">
  <rect width=".3" height=".3" fill="var(--soil)"/>
  <circle cx=".05" cy=".08" r=".018" fill="var(--soil-fleck)"/><circle cx=".2" cy=".05" r=".012" fill="var(--soil-fleck)"/>
  <circle cx=".14" cy=".2" r=".02" fill="var(--soil-fleck)"/><circle cx=".26" cy=".25" r=".014" fill="var(--soil-fleck)"/></pattern>
<pattern id="pSprout" patternUnits="userSpaceOnUse" width=".3" height=".3">
  <rect width=".3" height=".3" fill="var(--soil)"/>
  <circle cx=".05" cy=".26" r=".015" fill="var(--soil-fleck)"/><circle cx=".25" cy=".04" r=".012" fill="var(--soil-fleck)"/>
  <ellipse cx=".11" cy=".15" rx=".055" ry=".028" transform="rotate(-25 .11 .15)" fill="var(--sprout)"/>
  <ellipse cx=".19" cy=".15" rx=".055" ry=".028" transform="rotate(25 .19 .15)" fill="var(--sprout)"/>
  <circle cx=".15" cy=".15" r=".022" fill="var(--sprout-hi)"/></pattern>
<pattern id="pDeck" patternUnits="userSpaceOnUse" width="1.2" height=".3">
  <rect width="1.2" height=".3" fill="var(--deck)"/>
  <rect x="0" y=".02" width="1.2" height=".05" fill="var(--deck-hi)" opacity=".45"/><rect x="0" y=".17" width="1.2" height=".05" fill="var(--deck-hi)" opacity=".3"/>
  <path d="M0 .15H1.2M0 .3H1.2M0 0V.15M.6 .15V.3" stroke="var(--deck-joint)" stroke-width=".018" fill="none"/></pattern>
<pattern id="pPave" patternUnits="userSpaceOnUse" width=".4" height=".4">
  <rect width=".4" height=".4" fill="var(--path)"/>
  <rect x=".025" y=".025" width=".35" height=".15" fill="var(--path-hi)" opacity=".35"/>
  <rect x=".225" y=".225" width=".175" height=".15" fill="var(--path-hi)" opacity=".25"/>
  <rect x="0" y=".225" width=".175" height=".15" fill="var(--path-hi)" opacity=".3"/>
  <path d="M0 0H.4M0 .2H.4M0 0V.2M.4 0V.2M.2 .2V.4" stroke="var(--path-joint)" stroke-width=".025" fill="none"/></pattern>`;
function lockBadge(it,px){const r=px(10),cx=it.x+it.w-Math.min(r*1.3,it.w/2),cy=it.y+Math.min(r*1.3,it.h/2),k=px(13)/24;
  return `<g pointer-events="none"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--surface)" stroke="var(--sel)" stroke-width="${px(1.5)}"/><g transform="translate(${cx-12*k} ${cy-12*k}) scale(${k})" fill="none" stroke="var(--fg)" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="var(--fg)"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g></g>`}
function shape(it,on,px){
  const {x,y,w,h}=it,T=TYPES[it.type]||TYPES.bed,st=`var(${T.s})`,sw=px(1.5);
  if(it.type==="rest"){const long=w>=h,cx=x+w/2,cy=y+h/2,tr=Math.max(.3,Math.min(.6,Math.min(w,h)*.15)),bl=Math.min((long?w:h)*.6,1.8),off=tr+.4;
    let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${px(2)}" fill="url(#pDeck)" stroke="${st}" stroke-width="${px(2)}"/><g clip-path="url(#c${it.id})">`;
    for(const sg of [-1,1]){const bw=long?bl:.38,bh=long?.38:bl,bx=(long?cx:cx+sg*off)-bw/2,by=(long?cy+sg*off:cy)-bh/2;
      s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx=".05" fill="var(--furn)" stroke="var(--deck-joint)" stroke-width="${px(1)}"/>`}
    return s+`<circle cx="${cx}" cy="${cy}" r="${tr}" fill="var(--deck-hi)" stroke="var(--furn)" stroke-width="${px(2.5)}"/></g>`}
  if(it.type==="tree")return `<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" fill="url(#gTree)" stroke="${st}" stroke-width="${sw}"/>`;
  if(it.type==="path")return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#pPave)" stroke="${st}" stroke-width="${sw}"/>`;
  if(it.type==="flower")return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w,h)*.22}" fill="url(#gFl)" stroke="${st}" stroke-width="${sw}"/>`;
  if(it.type==="bed")return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${px(2)}" fill="url(#${on?"pSprout":"pSoil"})" stroke="${st}" stroke-width="${px(2)}"/>`+
    `<rect x="${x+px(2.5)}" y="${y+px(2.5)}" width="${Math.max(0,w-px(5))}" height="${Math.max(0,h-px(5))}" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="${px(1)}"/>`;
  if(it.type==="greenhouse"){
    let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${px(2)}" fill="url(#gGh)" fill-opacity=".92" stroke="${st}" stroke-width="${px(2)}"/>`;
    const long=w>h,n=Math.max(1,Math.round((long?w:h)/1));
    for(let i=1;i<n;i++)s+=long?`<line x1="${x+i*w/n}" y1="${y}" x2="${x+i*w/n}" y2="${y+h}" stroke="${st}" stroke-opacity=".55" stroke-width="${px(1)}"/>`
      :`<line x1="${x}" y1="${y+i*h/n}" x2="${x+w}" y2="${y+i*h/n}" stroke="${st}" stroke-opacity=".55" stroke-width="${px(1)}"/>`;
    s+=long?`<line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="${st}" stroke-width="${px(1.5)}"/>`
      :`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="${st}" stroke-width="${px(1.5)}"/>`;
    s+=`<rect x="${x+w*.08}" y="${y+h*.06}" width="${Math.min(w,h)*.12}" height="${h*.5}" fill="#ffffff" fill-opacity=".28"/>`;
    return s;
  }
  // building: hip roof seen from above
  const cx=x+w/2,cy=y+h/2;let a,b,P;
  if(w>=h){const r=h/2;a=[x+r,cy];b=[x+w-r,cy];
    P=[[[x,y],[x+w,y],b,a,"--bld-roof"],[[x,y+h],[x+w,y+h],b,a,"--bld"],[[x,y],a,[x,y+h],"--bld-side"],[[x+w,y],b,[x+w,y+h],"--bld-side"]]}
  else{const r=w/2;a=[cx,y+r];b=[cx,y+h-r];
    P=[[[x,y],[x,y+h],b,a,"--bld-roof"],[[x+w,y],[x+w,y+h],b,a,"--bld"],[[x,y],a,[x+w,y],"--bld-side"],[[x,y+h],b,[x+w,y+h],"--bld-side"]]}
  let s="";
  for(const p of P){const col=p.pop();s+=`<polygon points="${p.map(q=>q.join(",")).join(" ")}" fill="var(${col})" stroke="var(--bld-ridge)" stroke-width="${px(1)}" stroke-linejoin="round"/>`}
  s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--bld-ridge)" stroke-width="${px(2.5)}" stroke-linecap="round"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--bld-ridge)" stroke-width="${px(2)}"/>`;
  return s;
}

/* ---------- saving ---------- */
let tmr=null,busy=false,again=false,bkCol=null,undoStack=[],lastSaved=JSON.stringify(S),lastPushT=0;
function updUndo(){const b=$("#undoBtn");if(b)b.disabled=!undoStack.length}
function persist(noHist){
  S.sample=false;delete S.fresh;
  const cur=JSON.stringify(S);
  if(noHist!==true&&lastSaved&&lastSaved!==cur){const now=Date.now(),typing=noHist==="type";
    if(!typing||persist.k!=="type"||now-lastPushT>1500)undoStack.push(lastSaved);
    lastPushT=now;persist.k=typing?"type":"";if(undoStack.length>40)undoStack.shift()}
  lastSaved=cur;updUndo();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(tmr);tmr=setTimeout(flush,600);
}
async function flush(){
  if(!ref)return; if(busy){again=true;return}
  busy=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync("cloud")}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="not_granted"||e.code==="revoked")){ref=null;setSync("local")}else setSync("err")}
  busy=false; if(again){again=false;flush()}
}
function setSync(k){const el=$("#sync");el.className="sync"+(k==="cloud"?" cloud":"");
  el.querySelector("span").textContent=k==="cloud"?"Сохраняется в облаке":k==="err"?"Не удалось сохранить":"Сохраняется на этом устройстве"}
async function connect(){
  setSync("local");
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    ref=db.doc("data/users/"+id+"/plan");bkCol=db.collection("data/users/"+id);
    const sn=await ref.get();
    if(sn.exists){S=JSON.parse(JSON.stringify(sn.data()));lastSaved=JSON.stringify(S);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}dailyBackup()}
    else if(!S.sample&&!S.fresh){try{await ref.set(JSON.parse(JSON.stringify(S)))}catch(e){ref=null;setSync("local");return}}
    setSync("cloud"); renderAll();
  }catch(e){ref=null;setSync("local")}
}

/* ---------- safety: backups, file, undo ---------- */
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
async function dailyBackup(){if(!bkCol)return;try{
  const r=bkCol.doc("backup-"+dayKey(new Date())),s=await r.get();
  if(!s.exists)await r.set({at:new Date().toISOString(),plan:JSON.parse(JSON.stringify(S))});
  const all=await bkCol.get(),ids=all.docs.map(x=>x.id).filter(x=>x.startsWith("backup-")).sort();
  for(const old of ids.slice(0,Math.max(0,ids.length-14)))await bkCol.doc(old).delete();
}catch(e){}}
function applyPlan(plan,msg){S=JSON.parse(JSON.stringify(plan));delete S.sample;delete S.fresh;sel=null;panelOpen=false;persist();closeSheet();renderAll();$("#hint").textContent=msg}
function undo(){if(!undoStack.length)return;S=JSON.parse(undoStack.pop());sel=null;panelOpen=false;persist(true);renderAll();$("#hint").textContent="Последнее действие отменено."+(undoStack.length?" Нажмите ещё, чтобы отменить предыдущее.":"")}
const planSummary=p=>{const n=(p.items||[]).length;return n+" "+(n%10===1&&n%100!==11?"объект":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"объекта":"объектов")};
function backupSheet(){

    <div class="crops" id="bkList"><div class="none">Загружаю копии…</div></div>

    <div class="acts"><button class="btn sm pri" id="bkExport">Сохранить в файл</button><label class="btn sm" for="bkFile">Загрузить из файла</label><input type="file" id="bkFile" class="vh" accept=".json,application/json"></div>
    <p class="note" id="bkMsg" hidden></p>
    <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="bkClose">Закрыть</button></div>`,async()=>{

    $("#bkClose").onclick=closeSheet;
    $("#bkExport").onclick=async()=>{let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}
      if(!dl){try{const data=JSON.stringify({app:"moy-ogorod",version:1,savedAt:new Date().toISOString(),plan:S},null,1),u=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=`moy-ogorod-${dayKey(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg("Файл сохранён в «Загрузки».")}catch(e){msg("Не получилось сохранить файл.")}return}
      const data=JSON.stringify({app:"moy-ogorod",version:1,savedAt:new Date().toISOString(),plan:S},null,1);
      try{await dl.save({filename:`Мой огород ${dayKey(new Date())}.json`,data});msg("Файл сохранён.")}
      catch(e){if(e&&e.code==="declined")return;msg(e&&e.code==="rate_limited"?"Окно сохранения уже открыто. Подождите немного и попробуйте снова.":"Не получилось сохранить файл. Попробуйте ещё раз.")}};
    $("#bkFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(_){msg("Этот файл не похож на план участка. Выберите файл, сохранённый из этого приложения.");return}
        const p=o&&o.plan?o.plan:o;if(!p||!p.plot||!Array.isArray(p.items)){msg("В файле нет плана участка. Выберите файл, сохранённый из этого приложения.");return}
        const when=o.savedAt?new Date(o.savedAt).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"";
        sheet(`<h3>Загрузить план из файла?</h3><p class="note">В файле ${planSummary(p)}${when?", сохранён "+when:""}. Текущий план будет заменён. Вернуть его можно кнопкой отмены.</p>

    try{const all=await bkCol.get();const docs=all.docs.filter(d=>d.id.startsWith("backup-")).sort((a,b)=>a.id<b.id?1:-1);

      list.innerHTML=docs.map(d=>{const v=d.data()||{},p=v.plan||{},dt=new Date(v.at||d.id.slice(7));

    }catch(e){list.innerHTML=`<div class="none">Не удалось загрузить копии. Проверьте интернет и откройте окно снова.</div>`}
  });
}

/* ---------- plan drawing ---------- */
const box=$("#box"), svg=$("#plan");
function ppm(){return (box.clientWidth*zoom)/(S.plot.w+PAD*2)}
const cropsOf=(it,y)=>(it.crops||[]).filter(c=>c.year===y);

function drawPlan(){
  const W=S.plot.w,H=S.plot.h,VW=W+PAD*2,VH=H+PAD*2,k=ppm(),px=v=>v/k;
  svg.setAttribute("viewBox",`${-PAD} ${-PAD} ${VW} ${VH}`);
  svg.style.width=(box.clientWidth*zoom)+"px"; svg.style.height=(box.clientWidth*zoom*VH/VW)+"px";
  const fs=px(12), fsS=px(10.5);
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--plot)" stroke="var(--grid5)" stroke-width="${px(1.5)}"/>`;
  for(let x=1;x<W;x++)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${x%5?"var(--grid)":"var(--grid5)"}" stroke-width="${px(1)}"/>`;
  for(let y=1;y<H;y++)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${y%5?"var(--grid)":"var(--grid5)"}" stroke-width="${px(1)}"/>`;
  for(let x=0;x<=W;x+=5)g+=`<text x="${x}" y="${-px(8)}" font-size="${fsS}" text-anchor="middle" fill="var(--muted)">${x}</text>`;
  for(let y=0;y<=H;y+=5)g+=`<text x="${-px(8)}" y="${y+fsS*0.35}" font-size="${fsS}" text-anchor="end" fill="var(--muted)">${y}</text>`;
  g+=`<text x="${W}" y="${-px(8)}" font-size="${fsS}" text-anchor="end" fill="var(--muted)" dx="${px(14)}">м</text>`;
  const items=[...S.items].sort((a,b)=>(ORDER[a.type]??1)-(ORDER[b.type]??1)||(a.id===sel)-(b.id===sel));
  let defs="";
  for(const it of items){
    const T=TYPES[it.type]||TYPES.bed, cr=cropsOf(it,year), on=T.crops&&cr.length;
    const clip="c"+it.id; defs+=`<clipPath id="${clip}"><rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}"/></clipPath>`;
    g+=`<g class="obj" data-id="${it.id}">`+shape(it,on,px)+(it.locked?lockBadge(it,px):"");
    // labels
    if(it.type!=="path"||it.w*k>60||it.h*k>60){
      const vert=it.h>it.w*1.4, cx=it.x+it.w/2, cy=it.y+it.h/2;
      const lines=[];
      if(T.crops){ if(cr.length)lines.push([cr.map(c=>c.crop).join(", "),600,fs]); lines.push([it.name,400,fsS]) }
      else lines.push([it.name,500,fsS]);
      const span=(vert?it.h:it.w)*k, maxCh=Math.max(2,Math.floor(span/6.6));
      const cut=s=>s.length>maxCh?s.slice(0,maxCh-1)+"…":s;
      const tot=lines.reduce((a,l)=>a+l[2]*1.15,0); let y0=-tot/2;
      g+=`<g clip-path="url(#${clip})"><g transform="translate(${cx} ${cy})${vert?" rotate(-90)":""}">`;
      for(const [t,wt,sz] of lines){y0+=sz*1.05;g+=`<text x="0" y="${y0-sz*0.2}" font-size="${sz}" font-weight="${wt}" text-anchor="middle" fill="var(--label)" stroke="var(--halo)" stroke-width="${px(3)}" stroke-linejoin="round" paint-order="stroke" ${wt<500?'fill-opacity=".85"':""}>${esc(cut(t))}</text>`;y0+=sz*0.1}
      g+=`</g></g>`;
    }
    g+=`</g>`;
  }
  const s=S.items.find(i=>i.id===sel);
  if(s){
    g+=`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="none" stroke="var(--sel)" stroke-width="${px(2.5)}" ${s.locked?`stroke-dasharray="${px(6)} ${px(4)}"`:""} pointer-events="none"/>`;
    if(!s.locked)for(const [h,hx,hy] of [["nw",s.x,s.y],["ne",s.x+s.w,s.y],["sw",s.x,s.y+s.h],["se",s.x+s.w,s.y+s.h]])
      g+=`<g class="hdl" data-h="${h}"><circle cx="${hx}" cy="${hy}" r="${px(18)}" fill="transparent"/><circle cx="${hx}" cy="${hy}" r="${px(7)}" fill="var(--surface)" stroke="var(--sel)" stroke-width="${px(2.5)}"/></g>`;
  }
  svg.innerHTML=`<defs>${STATIC}${defs}</defs>`+g;
}

/* ---------- dragging ---------- */
let drag=null;
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener("pointerdown",e=>{
  if(ptrs.size>1){cancelDrag();bgTap=null;return}
  const h=e.target.closest(".hdl"), o=e.target.closest(".obj");
  if(!h&&!o){bgTap={x:e.clientX,y:e.clientY};return}
  bgTap=null;
  e.preventDefault();
  if(o&&!h&&o.dataset.id!==sel){sel=o.dataset.id;panelOpen=false;drawPlan();renderPanel();showSelHint()}
  const it=S.items.find(i=>i.id===sel); if(!it)return;
  const p=pt(e);
  drag={mode:h?h.dataset.h:"move",p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h},moved:false,id:it.id};
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
});
svg.addEventListener("pointermove",e=>{
  if(!drag)return;
  const it=S.items.find(i=>i.id===drag.id); if(!it)return;
  if(it.locked){if(Math.hypot(pt(e).x-drag.p0.x,pt(e).y-drag.p0.y)*ppm()>6)$("#hint").textContent=`${it.name} закреплён замком. Снимите замок, чтобы двигать.`;return}
  const p=pt(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,o=drag.o,W=S.plot.w,H=S.plot.h;
  if(!drag.moved&&Math.hypot(dx,dy)*ppm()<4)return;
  if(!drag.moved){drag.moved=true;if(panelOpen){panelOpen=false;renderPanel()}}
  if(drag.mode==="move"){
    it.x=r1(Math.min(Math.max(snap(o.x+dx),0),W-o.w)); it.y=r1(Math.min(Math.max(snap(o.y+dy),0),H-o.h));
  }else{
    let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
    if(drag.mode.includes("w"))x1=Math.min(Math.max(snap(o.x+dx),0),x2-MIN);
    if(drag.mode.includes("e"))x2=Math.max(Math.min(snap(x2+dx),W),x1+MIN);
    if(drag.mode.includes("n"))y1=Math.min(Math.max(snap(o.y+dy),0),y2-MIN);
    if(drag.mode.includes("s"))y2=Math.max(Math.min(snap(y2+dy),H),y1+MIN);
    it.x=r1(x1);it.y=r1(y1);it.w=r1(x2-x1);it.h=r1(y2-y1);
  }
  $("#hint").textContent=`${it.name}: ${m(it.w)} × ${m(it.h)} м · от края ${m(it.x)} и ${m(it.y)} м`;
  drawPlan();
});
function endDrag(){
  if(!drag)return;
  if(drag.moved){persist();syncSizeFields()}
  else if(drag.mode==="move"){const now=Date.now();
    if(lastTap.id===drag.id&&now-lastTap.t<450){panelOpen=true;renderPanel();lastTap={id:null,t:0}}
    else lastTap={id:drag.id,t:now}}
  drag=null;
}
let bgTap=null;
svg.addEventListener("pointerup",e=>{endDrag();
  if(bgTap){if(Math.hypot(e.clientX-bgTap.x,e.clientY-bgTap.y)<10&&sel){sel=null;panelOpen=false;drawPlan();renderPanel();$("#hint").textContent=defaultHint}bgTap=null}});svg.addEventListener("pointercancel",()=>{if(drag&&drag.moved){persist();syncSizeFields()}drag=null});
function showSelHint(){const it=S.items.find(i=>i.id===sel);$("#hint").textContent=it?`Выбрано: ${it.name}. ${it.locked?"Закреплён замком. ":""}Двойное касание открывает настройки.`:defaultHint}

const defaultHint=$("#hint").textContent;

/* ---------- two-finger zoom ---------- */
const ptrs=new Set();let pinch=null;
box.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")ptrs.add(e.pointerId)},true);
["pointerup","pointercancel"].forEach(t=>box.addEventListener(t,e=>ptrs.delete(e.pointerId),true));
function cancelDrag(){if(!drag)return;const it=S.items.find(i=>i.id===drag.id);if(it&&drag.moved){Object.assign(it,drag.o);drawPlan()}drag=null}
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
box.addEventListener("touchstart",e=>{if(e.touches.length!==2)return;e.preventDefault();cancelDrag();bgTap=null;
  const r=box.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  pinch={d0:tdist(e.touches),z0:zoom,w0:svg.clientWidth,h0:svg.clientHeight,cx:(box.scrollLeft+mx)/svg.clientWidth,cy:(box.scrollTop+my)/svg.clientHeight,mx,my}},{passive:false});
box.addEventListener("touchmove",e=>{if(!pinch||e.touches.length<2)return;e.preventDefault();
  const r=box.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  const z=Math.min(6,Math.max(1,pinch.z0*tdist(e.touches)/pinch.d0)),k=z/pinch.z0,w=pinch.w0*k,h=pinch.h0*k;zoom=z;
  svg.style.width=w+"px";svg.style.height=h+"px";box.scrollLeft=pinch.cx*w-mx;box.scrollTop=pinch.cy*h-my},{passive:false});
const endPinch=e=>{if(!pinch||e.touches.length>=2)return;pinch=null;try{localStorage.setItem(LS+"-zoom",zoom)}catch(_){}
  const sl=box.scrollLeft,st=box.scrollTop;drawPlan();box.scrollLeft=sl;box.scrollTop=st};
box.addEventListener("touchend",endPinch);box.addEventListener("touchcancel",endPinch);
["gesturestart","gesturechange"].forEach(t=>box.addEventListener(t,e=>e.preventDefault()));

/* ---------- panel ---------- */
function syncSizeFields(){const it=S.items.find(i=>i.id===sel);if(!it)return;
  const w=$("#o-w"),h=$("#o-h");if(w&&document.activeElement!==w)w.value=m(it.w);if(h&&document.activeElement!==h)h.value=m(it.h)}

  if(!it||!panelOpen){root.innerHTML="";$("#fab").hidden=false;return}

  const same=root.dataset.id===it.id&&root.querySelector(".panel"),keep=same?root.querySelector(".panel").scrollTop:0;root.dataset.id=it.id;

  const past={};(it.crops||[]).filter(c=>c.year!==year).forEach(c=>(past[c.year]=past[c.year]||[]).push(c));

  const fmtD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})};
  const used=[...new Set(S.items.flatMap(i=>(i.care||[]).map(c=>c.what)))];
  root.innerHTML=`<div class="panel" role="region" aria-label="Выбранный объект"><div class="in">

    <div class="row2">
      <div class="f"><label for="o-type">Тип</label><select id="o-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===it.type?" selected":""}>${v.l}</option>`).join("")}</select></div>
      <div class="row2"><div class="f"><label for="o-w">Ширина, м</label><input id="o-w" inputmode="decimal" value="${m(it.w)}"></div><div class="f"><label for="o-h">Длина, м</label><input id="o-h" inputmode="decimal" value="${m(it.h)}"></div></div>
    </div>
    ${it.locked?`<div class="locknote">Объект закреплён: положение, размер и тип не меняются.</div>`:""}
    <div class="acts"><button class="btn sm lock${it.locked?" on":""}" id="o-lock">${it.locked?LOCK_C+"Снять замок":LOCK_O+"Закрепить"}</button><button class="btn sm" id="o-rot">Повернуть на 90°</button><button class="btn sm" id="o-dup">Копия рядом</button><button class="btn sm del" id="o-del">Удалить</button></div>
    ${T.crops?`<h3 class="sec">Посажено в ${year} году</h3>
    <div class="crops">${cr.length?cr.map(c=>`<div class="crop"><div class="t">${esc(c.crop)}${c.variety?` <span class="v">«${esc(c.variety)}»</span>`:""}</div><button data-rmcrop="${c.id}" aria-label="Убрать ${esc(c.crop)}">×</button></div>`).join(""):`<div class="none">Пока ничего не записано.</div>`}</div>
    <form class="addcrop" id="cropForm"><input id="c-crop" placeholder="Культура" aria-label="Культура" autocomplete="off"><input id="c-var" placeholder="Сорт" aria-label="Сорт" autocomplete="off"><button class="btn pri">Добавить</button></form>
    ${prev.length&&!cr.length?`<div class="acts" style="margin-top:8px"><button class="btn sm" id="copyPrev">Перенести посадки ${year-1} года</button></div>`:""}
    <h3 class="sec">Что росло здесь раньше</h3>
    ${years.length?`<div class="hist">${years.map(y=>`<div><b>${y}</b>${past[y].map(c=>esc(c.crop)+(c.variety?` «${esc(c.variety)}»`:"")).join(", ")}</div>`).join("")}</div>`:`<div class="none" style="padding:0">Записей за другие годы нет.</div>`}`:""}
    ${careOk?`<h3 class="sec">Подкормки и обработки в ${year} году</h3>
    <div class="crops">${care.length?care.map(c=>`<div class="crop"><div class="t"><span class="cd">${fmtD(c.date)}</span><span class="ck" style="--c:${(CK[c.kind]||CK.feed).c}">${(CK[c.kind]||CK.feed).l}</span><br><b>${esc(c.what)}</b>${c.amount?` <span class="v">· ${esc(c.amount)}</span>`:""}</div><button data-rmcare="${c.id}" aria-label="Удалить запись">×</button></div>`).join(""):`<div class="none">Записей пока нет.</div>`}</div>
    <form class="careform" id="careForm">

      <div class="f"><label for="k-what">Чем или что вносили</label><input id="k-what" list="careList" placeholder="Нитроаммофоска, Фитоспорин, зола…" autocomplete="off"></div>

  if(same){const pn=root.querySelector(".panel");pn.classList.add("still");pn.scrollTop=keep}

      const date=$("#k-date").value||defDate;(it.care=it.care||[]).push({id:uid(),date,kind:$("#k-kind").value,what,amount:$("#k-amt").value.trim()});persist();

  $("#o-close").onclick=()=>{sel=null;panelOpen=false;drawPlan();renderPanel();$("#hint").textContent=defaultHint};
  $("#o-name").addEventListener("input",e=>{it.name=e.target.value;drawPlan();persist("type")});

  const size=(key,el)=>{const v=parseFloat(el.value.replace(",","."));if(!(v>=MIN))return;
    const lim=key==="w"?S.plot.w-it.x:S.plot.h-it.y;it[key]=r1(Math.min(v,lim));persist();drawPlan()};
  $("#o-w").addEventListener("change",e=>{size("w",e.target);syncSizeFields()});

  $("#o-dup").onclick=()=>{const n=JSON.parse(JSON.stringify(it));n.id=uid();n.crops=[];n.locked=false;
    const right=it.x+it.w*2+0.5<=S.plot.w;n.x=right?r1(it.x+it.w+0.5):it.x;n.y=right?it.y:r1(Math.min(it.y+it.h+0.5,S.plot.h-it.h));

    const cp=$("#copyPrev");if(cp)cp.onclick=()=>{prev.forEach(c=>it.crops.push({...c,id:uid(),year}));persist();drawPlan();renderPanel()};
  }
}
